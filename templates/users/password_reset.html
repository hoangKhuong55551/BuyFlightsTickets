{% extends "base.html" %}
{% block title %}Quên mật khẩu — SkyBook{% endblock %}

{% block content %}
<section style="max-width: 480px; margin: 60px auto; padding: 0 20px;">
  <div style="background: white; border: 1.5px solid var(--periwinkle); border-radius: 16px; padding: 40px;">
    <h1 style="font-size: 1.5rem; color: var(--penn-blue); margin-bottom: 8px; text-align: center;">🔑 Quên mật khẩu</h1>
    <p style="color: var(--text-muted); text-align: center; margin-bottom: 30px;">Nhập email đã đăng ký, chúng tôi sẽ gửi link đặt lại mật khẩu</p>

    <form method="post">
      {% csrf_token %}
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 600; color: var(--penn-blue); margin-bottom: 6px; font-size: .9rem;">Email</label>
        <input type="email" name="email" required
               placeholder="Nhập email đã đăng ký"
               style="width: 100%; padding: 12px 16px; border: 1.5px solid var(--periwinkle); border-radius: 10px; font-size: .95rem; outline: none; box-sizing: border-box;"
               onfocus="this.style.borderColor='var(--neon-blue)'"
               onblur="this.style.borderColor='var(--periwinkle)'">
      </div>
      {% if form.errors %}
      <div style="color: #dc3545; font-size: .85rem; margin-bottom: 16px;">{{ form.email.errors.0 }}</div>
      {% endif %}

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px; background: var(--neon-blue); color: white; border: none; font-weight: 600; cursor: pointer; font-size: 1rem;">Gửi link đặt lại mật khẩu</button>
    </form>

    <p style="text-align: center; margin-top: 16px;"><a href="{% url 'login' %}" style="color: var(--neon-blue); text-decoration: none;">← Quay lại đăng nhập</a></p>
  </div>
</section>
{% endblock %}
