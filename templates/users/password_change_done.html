{% extends "base.html" %}
{% block title %}Đổi mật khẩu thành công — SkyBook{% endblock %}

{% block content %}
<section style="max-width: 480px; margin: 60px auto; padding: 0 20px; text-align: center;">
  <div style="background: white; border: 1.5px solid var(--periwinkle); border-radius: 16px; padding: 40px;">
    <div style="font-size: 3rem; margin-bottom: 16px;">✅</div>
    <h1 style="font-size: 1.5rem; color: var(--penn-blue); margin-bottom: 12px;">Đổi mật khẩu thành công!</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">Mật khẩu của bạn đã được cập nhật. Lần đăng nhập tiếp theo hãy sử dụng mật khẩu mới.</p>
    <a href="{% url 'profile' %}" class="btn btn-primary" style="display: inline-block; padding: 12px 32px; background: var(--neon-blue); color: white; text-decoration: none; font-weight: 600;">Quay lại trang cá nhân</a>
  </div>
</section>
{% endblock %}
