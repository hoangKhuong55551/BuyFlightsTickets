{% extends "base.html" %}
{% block title %}Đặt lại mật khẩu thành công — SkyBook{% endblock %}

{% block content %}
<section style="max-width: 480px; margin: 60px auto; padding: 0 20px; text-align: center;">
  <div style="background: white; border: 1.5px solid var(--periwinkle); border-radius: 16px; padding: 40px;">
    <div style="font-size: 3rem; margin-bottom: 16px;">✅</div>
    <h1 style="font-size: 1.5rem; color: var(--penn-blue); margin-bottom: 12px;">Mật khẩu đã được đặt lại!</h1>
    <p style="color: var(--text-muted); margin-bottom: 24px;">Bạn có thể đăng nhập bằng mật khẩu mới ngay bây giờ.</p>
    <a href="{% url 'login' %}" class="btn btn-primary" style="display: inline-block; padding: 12px 32px; background: var(--neon-blue); color: white; text-decoration: none; font-weight: 600;">Đăng nhập ngay</a>
  </div>
</section>
{% endblock %}
