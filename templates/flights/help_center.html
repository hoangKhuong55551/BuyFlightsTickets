{% extends "base.html" %}

{% block title %}Trợ giúp - SkyBook{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto; padding: 40px 20px; text-align: center;">
    <h1 style="font-weight: 800; color: var(--navy); margin-bottom: 16px;">Trung tâm Hỗ trợ khách hàng SkyBook</h1>
    <p style="font-size: 1.1rem; color: var(--muted); margin-bottom: 32px;">Chúng tôi có thể giúp gì cho bạn?</p>
    
    <div style="max-width: 600px; margin: 0 auto; position: relative;">
        <input type="text" placeholder="Nhập vấn đề bạn cần được hỗ trợ..." style="width: 100%; padding: 16px 24px; font-size: 1rem; border-radius: 99px; border: 2px solid var(--border); box-shadow: var(--shadow); outline: none;">
        <button style="position: absolute; right: 8px; top: 8px; bottom: 8px; border: none; background: var(--blue); color: white; border-radius: 99px; padding: 0 24px; font-weight: 600; cursor: pointer;">Tìm kiếm</button>
    </div>
</div>
{% endblock %}
